services:
  test:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "composer install --no-interaction && cp .env.example .env && php artisan key:generate --no-interaction && php artisan test"

  app:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    command: ["tail", "-f", "/dev/null"]

  serve:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8000:8000"
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
